[project]
name = "monsterterm"
version = "0.1.0"
description = "Terminal dashboard for Monster P&L tracker"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0.0",
    "requests>=2.31.0",
]

[project.scripts]
monsterterm = "monsterterm.__main__:main"
MonsterTerm = "monsterterm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monsterterm"]
